<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion - Franchise Invest AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; height: 100vh; display: flex; align-items: center; }
        .login-card { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .btn-primary { background-color: #003366; border: none; }
        .btn-primary:hover { background-color: #002244; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card login-card p-4">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-primary">RestoLocate</h2>
                        <p class="text-muted">Plateforme SaaS d'Investissement AI</p>
                    </div>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Nom d'utilisateur</label>
                            {{ form.username }}
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Mot de passe</label>
                            {{ form.password }}
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2">Se connecter</button>
                        <div class="text-center mt-3">
    <span>Pas encore de compte ? </span><a href="{% url 'signup' %}" class="text-primary">S'inscrire ici</a>
</div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
