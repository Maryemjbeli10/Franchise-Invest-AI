<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Franchise Invest AI</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="font-sans text-gray-800 bg-gray-50">

    <!-- Navigation -->
    <nav class="bg-white shadow-sm sticky top-0 z-50 border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <!-- Logo -->
                <a href="{% url 'home' %}" class="flex items-center space-x-2">
                    <div class="w-10 h-10 bg-primary-600 rounded-xl flex items-center justify-center">
                        <i class="fas fa-brain text-white"></i>
                    </div>
                    <span class="text-xl font-bold text-gray-900">
                        Franchise<span class="text-primary-600">Invest</span>AI
                    </span>
                </a>

                <!-- Menu center -->
                <div class="hidden md:flex items-center space-x-8 text-sm font-medium">
                    <a href="{% url 'home' %}" class="text-gray-600 hover:text-primary-600">Accueil</a>
                    <a href="{% url 'franchises_list' %}" class="text-gray-600 hover:text-primary-600">Franchises</a>
                    <a href="{% url 'how_it_works' %}" class="text-gray-600 hover:text-primary-600">Comment ça marche</a>
                    <a href="{% url 'pricing' %}" class="text-gray-600 hover:text-primary-600">Tarifs</a>
                    <a href="{% url 'about' %}" class="text-gray-600 hover:text-primary-600">À propos</a>
                </div>

                <!-- Right buttons -->
                <div class="hidden md:flex items-center space-x-3">
                    <a href="{% url 'login' %}" class="text-gray-600 hover:text-primary-600 font-medium">
                        Connexion
                    </a>
                    <a href="{% url 'register' %}" class="px-4 py-2 bg-primary-600 hover:bg-primary-700 text-white rounded-xl text-sm font-semibold shadow-sm transition">
                        S'inscrire
                    </a>
                </div>

                <!-- Mobile button -->
                <button id="mobile-menu-btn" class="md:hidden text-gray-600">
                    <i class="fas fa-bars text-xl"></i>
                </button>
            </div>
        </div>
        
        <!-- Mobile Menu -->
        <div id="mobile-menu" class="hidden md:hidden bg-white border-t border-gray-100">
            <div class="px-4 py-3 space-y-2">
                <a href="{% url 'home' %}" class="block px-3 py-2 text-gray-600 hover:text-primary-600 hover:bg-gray-50 rounded-lg">Accueil</a>
                <a href="{% url 'franchises_list' %}" class="block px-3 py-2 text-gray-600 hover:text-primary-600 hover:bg-gray-50 rounded-lg">Franchises</a>
                <a href="{% url 'how_it_works' %}" class="block px-3 py-2 text-gray-600 hover:text-primary-600 hover:bg-gray-50 rounded-lg">Comment ça marche</a>
                <a href="{% url 'pricing' %}" class="block px-3 py-2 text-gray-600 hover:text-primary-600 hover:bg-gray-50 rounded-lg">Tarifs</a>
                <a href="{% url 'about' %}" class="block px-3 py-2 text-gray-600 hover:text-primary-600 hover:bg-gray-50 rounded-lg">À propos</a>
                <div class="border-t border-gray-100 pt-2 mt-2">
                    <a href="{% url 'login' %}" class="block px-3 py-2 text-gray-600 hover:text-primary-600">Connexion</a>
                    <a href="{% url 'register' %}" class="block px-3 py-2 text-primary-600 font-semibold">S'inscrire</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="min-h-[calc(100vh-64px)] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="w-full max-w-md">
            
            <!-- Logo centré au-dessus du formulaire -->
            <div class="flex justify-center mb-8">
                <div class="flex items-center space-x-3">
                    <div class="w-12 h-12 bg-primary-600 rounded-xl flex items-center justify-center shadow-lg">
                        <i class="fas fa-brain text-white text-xl"></i>
                    </div>
                    <span class="text-2xl font-bold text-gray-900">
                        Franchise<span class="text-primary-600">Invest</span>AI
                    </span>
                </div>
            </div>

            <!-- Card de connexion -->
            <div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-8">
                <div class="text-center mb-8">
                    <h1 class="text-2xl font-bold text-gray-900 mb-2">Connexion</h1>
                    <p class="text-gray-500">Accédez à votre espace personnel</p>
                </div>

                <form method="post" class="space-y-6">
                    {% csrf_token %}
                    
                    <!-- Nom d'utilisateur -->
                    <div>
                        <label for="id_username" class="block text-sm font-medium text-gray-700 mb-2">
                            Nom d'utilisateur
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fas fa-user text-gray-400"></i>
                            </div>
                            <input type="text" name="username" id="id_username" 
                                   class="block w-full pl-10 pr-3 py-3 border border-gray-200 rounded-xl bg-primary-50 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition"
                                   placeholder="Votre nom d'utilisateur" required>
                        </div>
                    </div>

                    <!-- Mot de passe -->
                    <div>
                        <label for="id_password" class="block text-sm font-medium text-gray-700 mb-2">
                            Mot de passe
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fas fa-lock text-gray-400"></i>
                            </div>
                            <input type="password" name="password" id="id_password" 
                                   class="block w-full pl-10 pr-3 py-3 border border-gray-200 rounded-xl bg-primary-50 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition"
                                   placeholder="Votre mot de passe" required>
                        </div>
                    </div>

                    <!-- Options -->
                    <div class="flex items-center justify-between">
                        <div class="flex items-center">
                            <input id="remember-me" name="remember-me" type="checkbox" 
                                   class="h-4 w-4 text-primary-600 focus:ring-primary-500 border-gray-300 rounded cursor-pointer">
                            <label for="remember-me" class="ml-2 block text-sm text-gray-600 cursor-pointer">
                                Se souvenir de moi
                            </label>
                        </div>
                    </div>

                    <!-- Bouton de connexion -->
                    <button type="submit" 
                            class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-sm text-sm font-semibold text-white bg-primary-600 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transition duration-200">
                        Se connecter
                    </button>
                </form>

                <!-- Lien d'inscription -->
                <div class="mt-6 text-center">
                    <p class="text-sm text-gray-600">
                        Pas encore de compte ? 
                        <a href="{% url 'signup' %}" class="font-medium text-primary-600 hover:text-primary-500 transition">
                            S'inscrire
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <!-- Mobile Menu Toggle Script -->
    <script>
        document.getElementById('mobile-menu-btn').addEventListener('click', function() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
        });
    </script>
</body>
</html>
